version: "2"
type: frontend
tech_stack:
  - TypeScript
  - Next.js 15
  - React 19
  - Tailwind CSS
  - Supabase
  - Recharts

routes:
  - path: /
    file: app/page.tsx
    auth_required: false
    description: Landing page

  - path: /home
    file: app/(landing)/home/page.tsx
    auth_required: false
    description: Home page

  - path: /auth/login
    file: app/auth/login/page.tsx
    auth_required: false
    description: User login page

  - path: /auth/register
    file: app/auth/register/page.tsx
    auth_required: false
    description: User registration page

  - path: /auth/callback
    file: app/auth/callback/route.ts
    auth_required: false
    description: OAuth callback handler

  - path: /dashboard
    file: app/dashboard/page.tsx
    auth_required: true
    description: User dashboard with courses and purchases

  - path: /dashboard/curso/[id]
    file: app/dashboard/curso/[id]/page.tsx
    auth_required: true
    description: Course details page

  - path: /dashboard/compra/[id]
    file: app/dashboard/compra/[id]/page.tsx
    auth_required: true
    description: Purchase details page

  - path: /courses
    file: app/courses/page.tsx
    auth_required: true
    description: Available courses listing

  - path: /admin
    file: app/admin/page.tsx
    auth_required: true
    description: Admin dashboard

  - path: /admin/cursos
    file: app/admin/cursos/page.tsx
    auth_required: true
    description: Admin courses management

  - path: /admin/cursos/nuevo
    file: app/admin/cursos/nuevo/page.tsx
    auth_required: true
    description: Create new course

  - path: /admin/cursos/[id]/edit
    file: app/admin/cursos/[id]/edit/page.tsx
    auth_required: true
    description: Edit course

  - path: /admin/estudiantes
    file: app/admin/estudiantes/page.tsx
    auth_required: true
    description: Admin students management

  - path: /admin/pagos
    file: app/admin/pagos/page.tsx
    auth_required: true
    description: Admin payments management

features:
  - name: User Authentication
    description: Login with email and password credentials via Supabase
    files:
      - app/auth/login/page.tsx
      - lib/auth.ts
      - lib/useAuth.ts
    entry_route: /auth/login
    user_interactions:
      - Fill email input field
      - Fill password input field
      - Click Login button to submit
      - See success redirect to dashboard or error message
    api_calls:
      - method: POST
        endpoint: /api/auth/login
    auth_required: false

  - name: User Registration
    description: Register new user account with email and password
    files:
      - app/auth/register/page.tsx
      - lib/auth.ts
    entry_route: /auth/register
    user_interactions:
      - Fill email input field
      - Fill password input field
      - Fill password confirmation field
      - Click Register button
      - See success message or validation errors
    api_calls:
      - method: POST
        endpoint: /api/auth/register
    auth_required: false

  - name: User Dashboard
    description: View user dashboard with enrolled courses and purchase history
    files:
      - app/dashboard/page.tsx
      - lib/compras.ts
    entry_route: /dashboard
    user_interactions:
      - View list of enrolled courses
      - View purchase history
      - Click on course to view details
      - Click on purchase to view details
    api_calls:
      - method: GET
        endpoint: /api/dashboard
    auth_required: true

  - name: Course Browsing
    description: Browse and view available courses
    files:
      - app/courses/page.tsx
      - app/dashboard/curso/[id]/page.tsx
    entry_route: /courses
    user_interactions:
      - View list of available courses
      - Click on course to view details
      - See course description and pricing
      - Click purchase button
    api_calls:
      - method: GET
        endpoint: /api/courses
    auth_required: true

  - name: Course Purchase
    description: Purchase courses from the platform
    files:
      - components/ModalCompra.tsx
      - lib/compras.ts
    entry_route: /courses
    user_interactions:
      - Click purchase button on course
      - See purchase confirmation modal
      - Fill payment information
      - Click confirm purchase
      - See purchase success message
    api_calls:
      - method: POST
        endpoint: /api/compras
      - method: POST
        endpoint: /api/pagos
    auth_required: true

  - name: Admin Dashboard
    description: Admin interface for managing courses, students, and payments
    files:
      - app/admin/page.tsx
    entry_route: /admin
    user_interactions:
      - View admin statistics and overview
      - Click on courses management
      - Click on students management
      - Click on payments management
    api_calls: []
    auth_required: true

  - name: Admin Course Management
    description: Create, read, update, and delete courses
    files:
      - app/admin/cursos/page.tsx
      - app/admin/cursos/nuevo/page.tsx
      - app/admin/cursos/[id]/edit/page.tsx
    entry_route: /admin/cursos
    user_interactions:
      - View list of courses
      - Click create new course button
      - Fill course form (title, description, price, etc)
      - Click save button
      - See success message
      - Click edit on existing course
      - Modify course details
      - Click delete course button
    api_calls:
      - method: GET
        endpoint: /api/cursos
      - method: POST
        endpoint: /api/cursos
      - method: PUT
        endpoint: /api/cursos/[id]
      - method: DELETE
        endpoint: /api/cursos/[id]
    auth_required: true

  - name: Admin Student Management
    description: View and manage registered students
    files:
      - app/admin/estudiantes/page.tsx
    entry_route: /admin/estudiantes
    user_interactions:
      - View list of all students
      - See student enrollment information
      - View student purchase history
    api_calls:
      - method: GET
        endpoint: /api/estudiantes
    auth_required: true

  - name: Admin Payment Management
    description: View and manage course payments
    files:
      - app/admin/pagos/page.tsx
    entry_route: /admin/pagos
    user_interactions:
      - View list of all payments
      - See payment status and amounts
      - Filter payments by status
    api_calls:
      - method: GET
        endpoint: /api/pagos
    auth_required: true

known_limitations:
  - issue: Environment variables required for Supabase connection
    location: .env.local
    impact: App will not function without proper Supabase configuration
  - issue: Some admin features may be UI-only without full backend integration
    location: app/admin/
    impact: Create/update/delete operations may not persist to database